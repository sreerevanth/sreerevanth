<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#111733"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="340" rx="24"/></clipPath>
    <style>
      .sans { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .blob1 { animation: drift1 14s ease-in-out infinite alternate; }
      .blob2 { animation: drift2 18s ease-in-out infinite alternate; }
      .blob3 { animation: drift1 22s ease-in-out infinite alternate-reverse; }
      @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(90px,30px); } }
      @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(-80px,-25px); } }
      .l1 { animation: show 9s infinite; animation-delay: 0s; }
      .l2 { animation: show 9s infinite; animation-delay: 1.2s; }
      .l3 { animation: show 9s infinite; animation-delay: 2.4s; }
      @keyframes show { 0% { opacity: 0; } 4% { opacity: 1; } 88% { opacity: 1; } 96% { opacity: 0; } 100% { opacity: 0; } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>

    <!-- aurora -->
    <g filter="url(#blur)" opacity="0.75">
      <circle class="blob1" cx="180" cy="60" r="170" fill="#7c3aed"/>
      <circle class="blob2" cx="560" cy="330" r="160" fill="#06b6d4"/>
      <circle class="blob3" cx="1060" cy="40" r="150" fill="#ec4899"/>
    </g>

    <!-- dot grid -->
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" opacity="0.08"/>
    </pattern>
    <rect width="1200" height="340" fill="url(#dots)"/>

    <!-- left: name -->
    <text x="64" y="104" class="mono" font-size="17" fill="#94a3b8" letter-spacing="3">HEY, I'M</text>
    <text x="60" y="172" class="sans" font-size="74" font-weight="800" fill="url(#name)" letter-spacing="-1">Sreerevanth</text>
    <text x="64" y="218" class="sans" font-size="24" fill="#e2e8f0">I build AI agents, and the guardrails</text>
    <text x="64" y="250" class="sans" font-size="24" fill="#e2e8f0">that stop them before they break things.</text>

    <!-- chips -->
    <g class="sans" font-size="15" font-weight="600">
      <rect x="64" y="276" width="150" height="32" rx="16" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="139" y="297" text-anchor="middle" fill="#67e8f9">AI Agents</text>
      <rect x="226" y="276" width="150" height="32" rx="16" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.5"/>
      <text x="301" y="297" text-anchor="middle" fill="#c4b5fd">Guardrails</text>
      <rect x="388" y="276" width="190" height="32" rx="16" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.5"/>
      <text x="483" y="297" text-anchor="middle" fill="#6ee7b7">● Open to freelance</text>
    </g>

    <!-- right: terminal -->
    <g transform="translate(700,70)">
      <rect width="440" height="208" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155"/>
      <circle cx="24" cy="22" r="6" fill="#f87171"/>
      <circle cx="44" cy="22" r="6" fill="#fbbf24"/>
      <circle cx="64" cy="22" r="6" fill="#34d399"/>
      <text x="420" y="27" text-anchor="end" class="mono" font-size="13" fill="#64748b">panoptis</text>
      <line x1="0" y1="44" x2="440" y2="44" stroke="#1e293b"/>

      <g class="mono" font-size="16">
        <g class="l1">
          <text x="24" y="84" fill="#64748b">agent ›</text>
          <text x="100" y="84" fill="#e2e8f0">rm -rf /</text>
          <rect x="300" y="66" width="116" height="26" rx="6" fill="#ef4444" fill-opacity="0.18"/>
          <text x="358" y="84" text-anchor="middle" fill="#f87171" font-weight="700">BLOCKED</text>
        </g>
        <g class="l2">
          <text x="24" y="124" fill="#64748b">agent ›</text>
          <text x="100" y="124" fill="#e2e8f0">git push --force</text>
          <rect x="300" y="106" width="116" height="26" rx="6" fill="#f59e0b" fill-opacity="0.18"/>
          <text x="358" y="124" text-anchor="middle" fill="#fbbf24" font-weight="700">ASK HUMAN</text>
        </g>
        <g class="l3">
          <text x="24" y="164" fill="#64748b">agent ›</text>
          <text x="100" y="164" fill="#e2e8f0">ls -la</text>
          <rect x="300" y="146" width="116" height="26" rx="6" fill="#10b981" fill-opacity="0.18"/>
          <text x="358" y="164" text-anchor="middle" fill="#34d399" font-weight="700">ALLOWED</text>
        </g>
        <text x="24" y="196" fill="#64748b">agent ›</text>
        <rect class="cursor" x="100" y="182" width="10" height="18" fill="#a78bfa"/>
      </g>
    </g>
  </g>
</svg>
